name: Tests

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet test tests/BitKraken.Tests/BitKraken.Tests.csproj --configuration Release --logger "console;verbosity=normal"
