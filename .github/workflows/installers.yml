name: Installers (macOS, Windows, Linux)

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 1.2.0). Leave empty to auto-increment 1.0.x"
        required: false
        default: ""

# One build per PR / branch; superseded preview builds are cancelled, release builds are not.
concurrency:
  group: installers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  # Resolved once so every platform in the matrix stamps the same version.
  # Pull request      -> 1.0.x-preview (next patch, not released)
  # Merge to main     -> 1.0.x         (next patch, tagged and released)
  # Tag push v1.2.3   -> 1.2.3
  # Manual dispatch   -> the version entered, else the next patch
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
      channel: ${{ steps.version.outputs.channel }}
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release tags drive the version counter

      - id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            channel="tag"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION#v}"
            channel="manual"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            version="$(scripts/next-version.sh preview)"
            channel="preview"
          else
            version="$(scripts/next-version.sh release)"
            channel="release"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "### BitKraken $version ($channel build)" >> "$GITHUB_STEP_SUMMARY"

      # Only source changes are worth an installer on main/master: a docs, packaging or
      # workflow only merge must not build and must not cut a release. Pull requests, tag
      # pushes and manual dispatches are never filtered - they always build.
      # (The filter lives here rather than in an `on.push.paths` trigger because that one
      # would apply to the `v*` tag pushes in the same trigger, whose payloads carry no
      # changed files, and would silently stop tagged releases from building at all.)
      - id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "push" || "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A new branch or a force-push leaves nothing to compare against; build rather
          # than silently skip.
          if [[ -z "${BEFORE}" || "${BEFORE}" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}" -- src)" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No \`src/\` changes in this push - skipping the installer build." >> "$GITHUB_STEP_SUMMARY"
          fi

  # A red test run must not produce an installer, let alone a release.
  test:
    name: Unit tests
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet test tests/BitKraken.Tests/BitKraken.Tests.csproj --configuration Release --logger "console;verbosity=normal"

  # Whether a notification carries BitKraken's logo comes down to which bundle posted it, and no
  # Linux box can answer that. This runs the helper on a real Mac and checks it is the one posting.
  notifier:
    name: macOS notification helper
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - run: scripts/verify-macos-notifier.sh

  package:
    name: ${{ matrix.name }}
    needs: [version, test]
    if: needs.version.outputs.build == 'true'
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash # git bash on the Windows runner, so one script serves every platform

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runs-on: macos-latest
            rid: osx-arm64
          - name: Windows (x64)
            runs-on: windows-latest
            rid: win-x64
          - name: Windows (arm64)
            runs-on: windows-latest
            rid: win-arm64
          - name: Linux (x64)
            runs-on: ubuntu-latest
            rid: linux-x64
          - name: Linux (arm64)
            runs-on: ubuntu-latest
            rid: linux-arm64

    env:
      VERSION: ${{ needs.version.outputs.value }}
      # Optional macOS code-signing / notarization. Leave the secrets unset to produce ad-hoc signed packages.
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Import signing certificate
        if: startsWith(matrix.rid, 'osx-') && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$MACOS_INSTALLER_IDENTITY" >> "$GITHUB_ENV"

      # macOS gets a real .app bundle plus .dmg/.pkg installers and Windows a setup .exe; every
      # platform also gets a self-contained single-file build archived as .zip (Windows) or
      # .tar.gz (Linux), for anyone who would rather not install anything.
      - name: Build app bundle, DMG and PKG
        if: startsWith(matrix.rid, 'osx-')
        run: scripts/package-macos.sh "${{ matrix.rid }}" "$VERSION"

      # The helper is checked again here, inside the bundle that actually ships. The other job builds
      # one into a temp directory, which is not the same artifact: this one is built in place, signed
      # over by `codesign --deep`, and carried through a .dmg and a .pkg. Nothing was looking at what
      # came out the far end of that, and "the logo is still missing" kept being reported against
      # builds whose standalone check had passed.
      - name: Verify the notification helper in the built app
        if: startsWith(matrix.rid, 'osx-')
        run: scripts/verify-macos-app.sh "publish/macos-${{ matrix.rid }}/BitKraken.app"

      - name: Build portable package
        if: ${{ !startsWith(matrix.rid, 'osx-') }}
        run: scripts/package-portable.sh "${{ matrix.rid }}" "$VERSION"

      # windows-latest ships Inno Setup, but the image's tool list is not a contract - install it
      # if a future image drops it.
      - name: Set up Inno Setup
        if: startsWith(matrix.rid, 'win-')
        run: |
          if [ -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            echo "Inno Setup is already installed."
          else
            choco install innosetup --no-progress -y
          fi

      - name: Build installer
        if: startsWith(matrix.rid, 'win-')
        run: scripts/package-windows.sh "${{ matrix.rid }}" "$VERSION"

      - name: Notarize
        if: startsWith(matrix.rid, 'osx-') && env.MACOS_CERTIFICATE_P12 != '' && env.APPLE_ID != '' && needs.version.outputs.channel != 'preview'
        run: |
          for f in dist/*.dmg dist/*.pkg; do
            xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$f"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: BitKraken-${{ needs.version.outputs.value }}-${{ matrix.rid }}
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  # Merges to main/master and tag pushes publish a GitHub Release (visible in the repo's
  # "Releases" panel, tagged v1.0.x); preview builds stay workflow artifacts only.
  release:
    name: Publish release
    needs: [version, package]
    if: needs.version.outputs.channel == 'release' || needs.version.outputs.channel == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download every platform's packages
        uses: actions/download-artifact@v8
        with:
          pattern: BitKraken-${{ needs.version.outputs.value }}-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.value }}
          name: BitKraken ${{ needs.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Link the release in the run summary
        run: |
          echo "Published [BitKraken ${{ needs.version.outputs.value }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.version.outputs.value }})" >> "$GITHUB_STEP_SUMMARY"
          ls -la dist >> "$GITHUB_STEP_SUMMARY"
