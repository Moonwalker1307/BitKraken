name: macOS installer (Apple Silicon)

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 1.2.0). Leave empty to auto-increment 1.0.x"
        required: false
        default: ""

# One build per PR / branch; superseded preview builds are cancelled, release builds are not.
concurrency:
  group: macos-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  package:
    name: Build .app, .dmg and .pkg (osx-arm64)
    runs-on: macos-latest # Apple Silicon runner

    env:
      # Optional code-signing / notarization. Leave the secrets unset to produce ad-hoc signed packages.
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release tags drive the version counter

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Pull request      -> 1.0.x-preview (next patch, not released)
      # Merge to main     -> 1.0.x         (next patch, tagged and released)
      # Tag push v1.2.3   -> 1.2.3
      # Manual dispatch   -> the version entered, else the next patch
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            channel="tag"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION#v}"
            channel="manual"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            version="$(scripts/next-version.sh preview)"
            channel="preview"
          else
            version="$(scripts/next-version.sh release)"
            channel="release"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "### BitKraken $version ($channel build)" >> "$GITHUB_STEP_SUMMARY"

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$MACOS_INSTALLER_IDENTITY" >> "$GITHUB_ENV"

      - name: Build app bundle, DMG and PKG
        run: scripts/package-macos.sh osx-arm64 "${{ steps.version.outputs.value }}"

      - name: Notarize
        if: env.MACOS_CERTIFICATE_P12 != '' && env.APPLE_ID != '' && steps.version.outputs.channel != 'preview'
        run: |
          for f in dist/*.dmg dist/*.pkg; do
            xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$f"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BitKraken-${{ steps.version.outputs.value }}-macos-arm64
          path: |
            dist/*.dmg
            dist/*.pkg
          if-no-files-found: error

      # Merges to main/master and tag pushes publish a GitHub Release (visible in the repo's
      # "Releases" panel, tagged v1.0.x); preview builds stay workflow artifacts only.
      - name: Publish release
        if: steps.version.outputs.channel == 'release' || steps.version.outputs.channel == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: BitKraken ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/*.dmg
            dist/*.pkg
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Link the release in the run summary
        if: steps.version.outputs.channel == 'release' || steps.version.outputs.channel == 'tag'
        run: |
          echo "Published [BitKraken ${{ steps.version.outputs.value }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.value }})" >> "$GITHUB_STEP_SUMMARY"
